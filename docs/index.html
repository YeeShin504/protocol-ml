<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>protocol-ml - Interactive Editor</title>
    <link rel="stylesheet" href="https://unpkg.com/codemirror@5.65.13/lib/codemirror.css">
    <link rel="stylesheet" href="https://unpkg.com/codemirror@5.65.13/addon/hint/show-hint.css">
    <link rel="stylesheet" href="./editor.css">
</head>

<body>
    <header>
        <div class="header-content">
            <div>
                <h1>protocol-ml</h1>
                <p class="subtitle">Interactive Protocol Diagram Editor</p>
            </div>
        </div>
    </header>

    <main id="main-container">
        <div class="panel help-panel" id="panel-reference">
            <div class="panel-header">
                <span class="panel-title">Reference</span>
            </div>
            <div class="search-container">
                <input type="text" id="refSearch" placeholder="Search reference..." autocomplete="off">
            </div>
            <div id="reference-list" class="panel-content reference-content">
                <div class="loading">Loading reference...</div>
            </div>
        </div>

        <div class="resizer" id="resizer-ref">
            <button id="toggleReference" class="toggle-arrow">◀</button>
        </div>

        <div class="panel" id="panel-editor">
            <div class="panel-header">
                <span class="panel-title">Code Editor</span>
                <button class="copy-btn" id="copyCode">Copy Code</button>
            </div>
            <div class="panel-content">
                <div id="editor"></div>
            </div>
        </div>

        <div class="resizer" id="resizer-preview"></div>

        <div class="panel" id="panel-preview">
            <div class="panel-header">
                <span class="panel-title">SVG Preview</span>
                <div>
                    <button class="copy-btn" id="copyPNG">Copy PNG</button>
                    <button class="copy-btn" id="copySVG" style="margin-left: 0.5rem;">Copy SVG</button>
                </div>
            </div>
            <div class="panel-content">
                <div id="preview"></div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/codemirror@5.65.13/lib/codemirror.js"></script>
    <script src="https://unpkg.com/codemirror@5.65.13/addon/runmode/runmode.js"></script>
    <script src="https://unpkg.com/codemirror@5.65.13/addon/hint/show-hint.js"></script>
    <script src="https://unpkg.com/codemirror@5.65.13/addon/comment/comment.js"></script>
    <script src="./syntax-highlight.js"></script>
    <script type="module" src="./editor.js"></script>
</body>

</html>
